<div class="contenido">
    <!-- Contenedor principal de la sección -->
    <div class="datos">
        <!-- Barra superior de navegación y búsqueda -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            <span class="separador">/</span>
            <strong id="foro">Foro</strong>
        </div>
        <a [routerLink]="['/']" class="flecha-derecha">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div [@slideForm]="cambiar ? 'visible' : 'hidden'">
            <form [formGroup]="formularioCRUDForo" class="mb-5">
                <!-- Formulario para engadir foro -->
                <h2 class="title is-4 has-text-light mb-4">Foros</h2>

                <div class="field">
                    <div class="control">
                        <input class="input has-background-black-ter has-text-light" type="text"
                            placeholder="Nombre del foro" formControlName="tema">
                    </div>
                    <p *ngIf="formularioCRUDForo.get('tema')?.touched && formularioCRUDForo.get('tema')?.invalid"
                        class="help is-danger">
                        Debes indicar el tema
                    </p>
                </div>

                <div class="field is-grouped is-grouped-multiline">
                    <div class="control">
                        <button *ngIf="cambiar" (click)="engadirForo()" [disabled]="formularioCRUDForo.invalid"
                            class="button is-link">
                            Añadir foro
                        </button>
                    </div>
                    <div class="control">
                        <button *ngIf="cambiar" (click)="cancelar(formularioCRUDForo)" class="button is-warning">
                            Cancelar
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <!-- Foro -->
        <p *ngIf="foros?.length === 0" class="mensaje-foros-vacio has-text-centered has-text-grey-light">
            💬 Aún no se ha creado ningún foro. ¡Pronto podrás unirte a conversaciones sobre el universo y compartir tus
            ideas!
        </p>

        <div class="foros" *ngFor="let foro of foros">
            <a [routerLink]="['/debate', foro.id]">{{foro.tema}}</a>

            <span id="foro_fecha">
                {{ foro.fecha_creacion }}
            </span>
        </div>
        <button class="btn-nuevo-tema" (click)="mostrarFormulario()">+ Nuevo Tema</button>

    </div>
</div>
