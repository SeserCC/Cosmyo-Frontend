<div class="d-flex align-items-center justify-content-center vh-100 bg-dark text-light">
    <div class="text-center p-4 rounded shadow" style="max-width: 500px; width: 100%;">

        <!-- Icono -->
        <div class="mb-4">
            <i class="bi bi-moon-stars-fill" style="font-size: 80px;"></i>
        </div>

        <!-- Título -->
        <h1 class="mb-3">Estamos en mantenimiento</h1>

        <!-- Mensaje -->
        <p class="mb-4" style="color: rgb(161, 161, 161);">
            Estamos realizando mejoras para ofrecerte una mejor experiencia.
            Vuelve en unos minutos 🚀
        </p>

        <!-- Spinner -->
        <div class="mb-4">
            <div class="spinner-border text-light" role="status"></div>
        </div>

        <!-- Botón opcional -->
        <button class="btn btn-outline-light" (click)="reload()">
            Reintentar
        </button>

    </div>
</div>
