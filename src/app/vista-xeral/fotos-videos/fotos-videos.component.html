<div class="contenido">
    <!-- Contenedor principal -->
    <div class="datos">
        <!-- Mapa de navegación -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            /
            <span id="fotos_videos">Imágenes y vídeos</span>
        </div>

        <a [routerLink]="['/']" class="flecha-derecha">
            <i class="bi bi-arrow-left"></i>
        </a>

        <form [formGroup]="buscadorForm">
            <div class="field has-addons is-fullwidth mb-4 mt-4">

                <div class="control is-expanded">
                    <input type="text" class="input" formControlName="titulo" placeholder="Buscar publicaciones...">
                </div>
                <div class="control">
                    <button class="button" (click)="filtrarPublicaciones(buscadorForm.get('titulo')?.value)">
                        Buscar
                    </button>
                </div>
            </div>
            <p class="help is-danger mb-3" *ngIf="mensajeError">{{mensajeError.message}}</p>

        </form>

        <!-- Galería de imágenes -->
        <div class="columns is-multiline is-variable is-2">
            <div *ngIf="publicaciones?.length === 0" class="column is-12">
                <p class="mensaje-galeria-vacia has-text-centered has-text-grey-light">
                    ✨ Aún no hay publicaciones disponibles. ¡Vuelve pronto para explorar increíbles capturas del cosmos!
                </p>
            </div>

            <ng-template #content>
                <div class="columns is-multiline is-mobile">

                    <div title="{{publicacion.titulo}}" *ngFor="let publicacion of publicaciones" class="column is-2-desktop is-2-tablet is-4-mobile">

                        <a [routerLink]="['/publicacion', publicacion.id]">
                            <div class="imagen-publicacion">
                                <img [src]="publicacion.imagen" alt="Imagen">
                            </div>
                        </a>

                    </div>

                </div>
            </ng-template>

        </div>

        <ng-container *ngIf="carga; else content">
            <div class="loading-container">
                <div class="loader loader-big"></div>
                <p class="has-text-light mt-4">Cargando...</p>
            </div>
        </ng-container>
    </div>

</div>
