<div class="contenido">

    <div class="datos">

        <!-- Mapa de navegación -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            /
            <span id="pago">Pago exitoso</span>
        </div>

        <!-- Mensaje de confirmación -->
        <div class="notification is-success astro-box">
            <h2 class="title is-4 has-text-white">✨ ¡Pago realizado con éxito! ✨</h2>
            <p class="has-text-light">
                Tu suscripción premium ha sido activada correctamente.
                Gracias por apoyarnos <i class="bi bi-rocket-takeoff"></i>
            </p>
        </div>

        <button [routerLink]="['/perfil', usuarioActual?.id]">Regresar al perfil</button>

    </div>
</div>
