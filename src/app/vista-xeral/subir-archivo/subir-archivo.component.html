<div class="contenido">
    <!-- Formulario para subir archivos -->

    <div class="datos">
        <!-- Mapa de navegación para indicar la ubicación actual al usuario -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            /
            <a [routerLink]="['/foto']">Galeria</a>
            /
            <span id="subir_archivos">Nueva publicacion</span>

        </div>

        <a [routerLink]="['/foto']" class="flecha-derecha">
            <i class="bi bi-arrow-left"></i>
        </a>

        <form [formGroup]="formularioPublicacion" (ngSubmit)="engadirPublicacion()">
            <!-- Campo para ingresar el título del archivo -->
            <div class="titulo_info">
                <label id="texto_titulo">Título</label>
                <input class="titulo_archivo" formControlName="titulo" type="text">
            </div>
            <div *ngIf="formularioPublicacion.get('titulo')?.touched && formularioPublicacion.get('titulo')?.invalid"
                class="erro">
                Debes indicar el titulo
            </div>

            <!-- Campo para ingresar la descripción del archivo -->
            <div id="descripcion_info">
                <label id="texto_descripcion">Descripción</label>
                <textarea class="descripcion_archivo" formControlName="descripcion"></textarea>
            </div>
            <div *ngIf="formularioPublicacion.get('descripcion')?.touched && formularioPublicacion.get('descripcion')?.invalid"
                class="erro">
                Debes indicar la descripcion
            </div>

            <div class="zona_geografica_info">
                <label id="texto_zona_geografica">Zona geografica</label>
                <input class="zona_geografica" formControlName="zona_geografica" type="text">
            </div>
            <div *ngIf="formularioPublicacion.get('zona_geografica')?.touched && formularioPublicacion.get('zona_geografica')?.invalid"
                class="erro">
                Debes indicar la zona geografica
            </div>

            <!-- Selector de archivos con mensaje sobre los formatos aceptados -->
            <label for="seleccionar_archivo" class="archivo" [class.archivo-cargado]="faltaArchivo">
                <i class="fa-solid" [ngClass]="faltaArchivo ? 'fa-circle-check' : 'fa-upload'"></i>

                {{ faltaArchivo ? 'Archivo seleccionado' : 'Seleccionar archivo' }}

                <p *ngIf="!faltaArchivo">
                    Formatos que aceptamos: JPG - JPEG - PNG - GIF - TIFF - AVIF - WMV -
                    WEBP
                </p>

                <p *ngIf="faltaArchivo" class="nombre_archivo">
                    {{ nombreArchivo }}
                </p>
            </label>

            <input id="seleccionar_archivo" type="file" (change)="cargarArchivo($event)">

            <p class="erro" *ngIf="mensajeError?.errors.imagen">{{mensajeError.message}}</p>

            <p *ngIf="!mensajeError" class="text-white-50 small fst-italic mb-1" style="font-size: 0.8rem;">
                Peso máximo permitido: 10 MB
            </p>
            <!-- Botón para enviar el formulario -->

            <div *ngIf="loading" class="loader"></div>
            <ng-container *ngIf="!loading">
                <button id="enlace_subir_archivo" type="submit"
                    [disabled]="formularioPublicacion.invalid || !archivoSelect">
                    Subir
                    <i class="fa-solid fa-upload"></i>
                </button>
            </ng-container>

        </form>
    </div>


</div>
