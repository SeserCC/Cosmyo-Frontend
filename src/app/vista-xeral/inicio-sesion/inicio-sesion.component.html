<div class="contenido">
    <!-- Contenedor principal -->
    <div class="datos">
        <!-- Mapa de navegación -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            /
            <strong id="inicio_sesion">Inicio sesión</strong>
        </div>

        <a [routerLink]="['/']" class="flecha-derecha">
            <i class="bi bi-arrow-left"></i>
        </a>

        <!-- Contenedor del formulario de inicio de sesión -->
        <form [formGroup]="formularioLogin" class="usuario_contrasena" (ngSubmit)="iniciarSesion($event)">
            <!-- Título del formulario -->
            <h1 class="title is-4 has-text-centered">Iniciar Sesión</h1>
            <p *ngIf="errorMensaje" class="mensaje-error">
                {{ errorMensaje }}
            </p>
            <!-- Campo de usuario -->
            <label id="lusuario">
                <i class="fa-solid fa-user-astronaut"></i>
                <strong> Usuario:</strong>
            </label>
            <input id="usuario" class="form-control bg-dark text-light" type="text" placeholder="TON_618..." formControlName="usuario">
            <p *ngIf="formularioLogin.get('usuario')?.invalid && formularioLogin.get('usuario')?.touched"
                class="mensaje-error">
                <span *ngIf="formularioLogin.get('usuario')?.hasError('required')">El usuario es obligatorio.</span>
                <span *ngIf="formularioLogin.get('usuario')?.hasError('pattern')">Solo letras y números
                    permitidos.</span>
            </p>

            <!-- Campo de contraseña -->
            <label for="contrasena" id="lcontrasena">
                <i class="bi bi-lock-fill"></i>
                <strong> Contraseña:</strong>
            </label>
            <input id="contrasena" class="form-control bg-dark text-light" type="password" placeholder="Contraseña..."
                formControlName="contrasinal">
            <p *ngIf="formularioLogin.get('contrasinal')?.invalid && formularioLogin.get('contrasinal')?.touched"
                class="mensaje-error">
                <span *ngIf="formularioLogin.get('contrasinal')?.hasError('required')">La contraseña es
                    obligatoria.</span>
                <span *ngIf="formularioLogin.get('contrasinal')?.hasError('minlength')">Mínimo 4 caracteres.</span>
            </p>

            <!-- Campo del captcha -->
            <div id="captcha_info">
                <input id="captcha_checkbox" #captcha_checkbox formControlName="captcha" type="checkbox">
                <label>No soy un robot</label>
            </div>
            <p *ngIf="formularioLogin.get('captcha')?.invalid && formularioLogin.get('captcha')?.touched"
                class="mensaje-error">
                Tienes que marcar el captcha
            </p>

            <!-- Botón de enviar -->
            <button type="submit" id="continuar">
                Iniciar sesión
            </button>
        </form>

    </div>
</div>
