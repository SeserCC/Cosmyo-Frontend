<div class="contenido">
    <!-- Contenedor principal -->

    <div class="datos">
        <!-- Mapa de navegación -->
        <div id="mapa_navegacion">
            <a [routerLink]="['/']">
                <i class="bi bi-house"></i>
            </a>
            /
            <span id="inicio_sesion">Inicio sesión</span>
        </div>

        <a [routerLink]="['/']" class="flecha-derecha">
            <i class="bi bi-arrow-left"></i>
        </a>

        <!-- Contenedor del formulario de inicio de sesión -->
        <form [formGroup]="formularioLogin" class="usuario_contrasena" (ngSubmit)="iniciarSesion($event)">
            <!-- Título del formulario -->
            <h1 class="title is-4 has-text-centered">Iniciar Sesión</h1>
            <p *ngIf="errorMensaje" class="mensaje-error">
                {{ errorMensaje }}
            </p>
            <!-- Campo de usuario -->
            <label id="lusuario">
                <i class="fa-solid fa-user-astronaut"></i>
                Correo electrónico:
            </label>
            <input id="usuario" class="form-control bg-dark text-light" type="email" placeholder="ton_618@example.com"
                formControlName="usuario">
            <p *ngIf="formularioLogin.get('usuario')?.invalid && formularioLogin.get('usuario')?.touched"
                class="mensaje-error">
                <span *ngIf="formularioLogin.get('usuario')?.hasError('required')">El correo es obligatorio.</span>
                <span *ngIf="formularioLogin.get('usuario')?.hasError('pattern')">Solo letras y números
                    permitidos.</span>
                <span *ngIf="formularioLogin.get('usuario')?.hasError('email')">El correo no tiene el formato
                    correcto.</span>
            </p>

            <!-- Campo de contraseña -->
            <label for="contrasena" id="lcontrasena">
                <i class="bi bi-lock-fill"></i>
                Contraseña:
            </label>
            <div class="input-container">
                <input id="contrasena" class="form-control bg-dark text-light" [type]="mostrarContrasinal"
                    placeholder="Contraseña" formControlName="contrasinal">
                <button type="button" class="toggle-password"
                    (click)="mostrarContrasinal === 'password' ? mostrar() : ocultar()">
                    <i class="bi" [ngClass]="mostrarContrasinal === 'password' ? 'bi-eye' : 'bi-eye-slash'"></i>
                </button>
            </div>
            <p *ngIf="formularioLogin.get('contrasinal')?.invalid && formularioLogin.get('contrasinal')?.touched"
                class="mensaje-error">
                <span *ngIf="formularioLogin.get('contrasinal')?.hasError('required')">La contraseña es
                    obligatoria.</span>
            </p>

            <!-- Campo del captcha -->
            <div id="captcha_info">
                <input id="captcha_checkbox" #captcha_checkbox formControlName="captcha" type="checkbox">
                <label>No soy un robot</label>
            </div>
            <p *ngIf="formularioLogin.get('captcha')?.invalid && formularioLogin.get('captcha')?.touched"
                class="mensaje-error">
                Tienes que marcar el captcha
            </p>


            <div *ngIf="abriendoSesionCarga" class="loader"></div>
            <!-- Botón de enviar -->
            <ng-container *ngIf="!abriendoSesionCarga">
                <button class="iniciar_sesion" type="submit" [disabled]="formularioLogin.invalid">
                    Iniciar Sesión
                </button>
            </ng-container>

        </form>

    </div>
</div>
