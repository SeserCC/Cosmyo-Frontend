image: node:20

stages:
  - build
  - deploy

astronexus-build:
  stage: build
  
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci
    - rm -rf dist/
  script:
    - npm run build --configuration=production
    - mv dist/astronexus/browser/index.csr.html dist/astronexus/browser/index.html
  artifacts:
    paths:
      - dist/

astronexus-deploy:
  stage: deploy
  script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 130.110.235.77 >> ~/.ssh/known_hosts
    - rsync -avz dist/astronexus/browser/ deploy@130.110.235.77:/var/www/frontend/
  only:
    - main