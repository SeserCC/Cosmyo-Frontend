image: node:20

stages:
  - build
  - deploy

cosmyo-build:
  stage: build
  
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npm run build --configuration=production
    - curl https://api.cosmyo.com/sitemap.xml -o dist/cosmyo/browser/sitemap.xml
    - mv dist/cosmyo/browser/index.csr.html dist/cosmyo/browser/index.html
  artifacts:
    paths:
      - dist/

cosmyo-deploy:
  stage: deploy
  script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 130.110.235.77 >> ~/.ssh/known_hosts
    - rsync -avz --delete dist/cosmyo/browser/ deploy@130.110.235.77:/var/www/frontend/
  only:
    - main