image: node:20

stages:
  - build
  - deploy

astronexus-build:
  stage: build
  
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npm run build --configuration=production
  artifacts:
    paths:
      - dist/

astronexus-deploy:
  stage: deploy
  script:
    - apt-get update -y
    - apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - cat "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 130.110.235.77 >> ~/.ssh/known_hosts
    - ssh -v ubuntu@130.110.235.77 "echo OK"
    - rsync -avz dist/astronexus/browser/ ubuntu@130.110.235.77:/var/www/frontend/
  only:
    - main